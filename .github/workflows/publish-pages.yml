name: Verify release and deploy downloads

on:
  repository_dispatch:
    types: [flatpak-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to deploy, e.g. 0.1.0 (blank selects newest)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: signed-flatpak-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 7e0fbb3cddc903998fae87a75cd8462c8eb01165
          persist-credentials: false
      - name: Install public verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Download and authenticate the newest published site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 tools/verify_flatpak_site.py --output "$RUNNER_TEMP/verified-pages" --download
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/verified-pages/site
      - name: Check freshness immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/verify_flatpak_site.py --output "$RUNNER_TEMP/verified-pages" --check-freshness
      - name: Deploy verified public files
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
